name: İnatBox M3U Extractor

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - run: pip install requests pycryptodome
      
      - run: python inatbox_extractor.py
      
      - name: Commit M3U
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.m3u 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update M3U playlist $(date '+%Y-%m-%d')"
          git push
